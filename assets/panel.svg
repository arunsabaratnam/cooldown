<svg xmlns="http://www.w3.org/2000/svg" width="688" height="1064" viewBox="0 0 688 1064" role="img" aria-label="The Cooldown panel, listing the 5-hour and weekly quota left for Claude and Codex"><g transform="scale(2)"><defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2B2E5A"></stop><stop offset="48%" stop-color="#2A2348"></stop><stop offset="100%" stop-color="#3E2745"></stop></linearGradient><radialGradient id="glowA" cx="18%" cy="0%" r="70%"><stop offset="0%" stop-color="#5A4490" stop-opacity="0.85"></stop><stop offset="100%" stop-color="#5A4490" stop-opacity="0"></stop></radialGradient><radialGradient id="glowB" cx="92%" cy="10%" r="65%"><stop offset="0%" stop-color="#1F7B92" stop-opacity="0.75"></stop><stop offset="100%" stop-color="#1F7B92" stop-opacity="0"></stop></radialGradient></defs><rect x="0" y="0" width="344" height="532" rx="10" fill="url(#sky)"></rect><rect x="0" y="0" width="344" height="532" rx="10" fill="url(#glowA)"></rect><rect x="0" y="0" width="344" height="532" rx="10" fill="url(#glowB)"></rect><g transform="translate(22,22)"><rect x="0" y="0" width="300" height="488" rx="12" fill="#26262C" fill-opacity="0.86" stroke="#FFFFFF" stroke-opacity="0.16"></rect><text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F5F5F7" fill-opacity="1.0" text-anchor="start">Usage</text><text x="286" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="end">Updated just now</text><rect x="0" y="40" width="300" height="1" fill="#FFFFFF" fill-opacity="0.11"></rect><text x="14" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#F5F5F7" fill-opacity="1.0" text-anchor="start">Claude</text><text x="286" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="end">just now</text><text x="14" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#F5F5F7" fill-opacity="0.78" text-anchor="start">5-hour</text><text x="286" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" fill="#F5F5F7"><tspan font-weight="600">62%</tspan><tspan fill-opacity="0.78"> left</tspan></text><rect x="14" y="87" width="272" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.13"></rect><rect x="14" y="87" width="168.6" height="6" rx="3" fill="#4ADE80"></rect><text x="14" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="start">resets in 2h 41m</text><text x="14" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#F5F5F7" fill-opacity="0.78" text-anchor="start">Weekly</text><text x="286" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" fill="#F5F5F7"><tspan font-weight="600">38%</tspan><tspan fill-opacity="0.78"> left</tspan></text><rect x="14" y="129" width="272" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.13"></rect><rect x="14" y="129" width="103.4" height="6" rx="3" fill="#4ADE80"></rect><text x="14" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="start">resets in 3d 4h</text><text x="14" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#F5F5F7" fill-opacity="0.78" text-anchor="start">Weekly (large model)</text><text x="286" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" fill="#F5F5F7"><tspan font-weight="600">18%</tspan><tspan fill-opacity="0.78"> left</tspan></text><rect x="14" y="171" width="272" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.13"></rect><rect x="14" y="171" width="49.0" height="6" rx="3" fill="#FB923C"></rect><text x="14" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="start">resets in 3d 4h</text><text x="14" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="start">usage endpoint (live)</text><text x="14" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#F5F5F7" fill-opacity="1.0" text-anchor="start">Codex</text><text x="286" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="end">just now</text><text x="14" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#F5F5F7" fill-opacity="0.78" text-anchor="start">5-hour</text><text x="286" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" fill="#F5F5F7"><tspan font-weight="600">41%</tspan><tspan fill-opacity="0.78"> left</tspan></text><rect x="14" y="254" width="272" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.13"></rect><rect x="14" y="254" width="111.5" height="6" rx="3" fill="#4ADE80"></rect><text x="14" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="start">resets in 1h 12m</text><text x="14" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#F5F5F7" fill-opacity="0.78" text-anchor="start">Weekly</text><text x="286" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" fill="#F5F5F7"><tspan font-weight="600">9%</tspan><tspan fill-opacity="0.78"> left</tspan></text><rect x="14" y="296" width="272" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.13"></rect><rect x="14" y="296" width="24.5" height="6" rx="3" fill="#F87171"></rect><text x="14" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="start">resets in 5d 2h</text><text x="14" y="331" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="start">codex app-server (live)</text><rect x="0" y="345" width="300" height="1" fill="#FFFFFF" fill-opacity="0.11"></rect><rect x="14" y="356" width="272" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.18"></rect><g transform="translate(51.95,364.2) scale(0.85)" stroke="#F5F5F7" stroke-opacity="0.93" fill="none" stroke-width="1.7" stroke-linecap="round"><path d="M4.32 11.68 A 5.2 5.2 0 1 1 11.68 11.68"></path><path d="M8 8 L 10.7 5.62"></path><circle cx="8" cy="8" r="1.25" fill="#F5F5F7" fill-opacity="0.93" stroke="none"></circle></g><text x="160.3" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#F5F5F7" fill-opacity="1.0" text-anchor="middle">Start the 5-hour cooldown</text><text x="14" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="start">Sends one short throwaway prompt now, so the</text><text x="14" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="start">5-hour clock is already running when you sit</text><text x="14" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="start">down. It shifts the window earlier; it does not</text><text x="14" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#F5F5F7" fill-opacity="0.56" text-anchor="start">add quota, and it does not move the weekly one.</text><rect x="0" y="452" width="300" height="1" fill="#FFFFFF" fill-opacity="0.11"></rect><text x="14" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#F5F5F7" fill-opacity="0.78" text-anchor="start">Settings</text><text x="286" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#F5F5F7" fill-opacity="0.78" text-anchor="end">Quit</text></g></g></svg>
